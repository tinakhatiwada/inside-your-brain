<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Explore the Brain in 3D — Inside the Brain</title>
  <meta name="description" content="Interactive 3D brain explorer with clickable regions.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <nav class="site-nav">
    <a href="index.html" class="nav-brand"><span class="icon">🧠</span><span>Inside the Brain</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="explore.html">Explore in 3D</a></li>
      <li><a href="journey.html">How Thoughts Form</a></li>
      <li><a href="library.html">Library</a></li>
      <li><a href="quiz.html">Quiz</a></li>
    </ul>
  </nav>
  <main id="main">
    <section class="brain-viewer-section">
      <div class="brain-canvas-container" id="brain-canvas">
        <div class="loading-text" id="loading-text">Loading brain model...</div>
      </div>
      <div class="brain-legend" id="brain-legend"></div>
      <div class="brain-info-panel" id="brain-info-panel">
        <div class="brain-info-header">
          <div class="color-dot" id="info-dot"></div>
          <h3 id="info-name"></h3>
        </div>
        <div class="brain-fn-tags" id="info-fns"></div>
        <div class="brain-info-desc" id="info-desc"></div>
        <div class="brain-info-fact" id="info-fact"></div>
        <div class="brain-connections" id="info-connections">
          <h4>Connections</h4>
          <p id="info-conn-text"></p>
        </div>
        <button class="brain-back-btn" id="brain-back-btn">← Back to full brain</button>
      </div>
      <div class="brain-instruction">Click any lobe to learn about it · Drag to rotate · Scroll to zoom</div>
    </section>
  </main>
  <script type="module" src="/src/pages/explore.js"></script>
</body>
</html>
