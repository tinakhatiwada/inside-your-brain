<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explore the brain · Inside Your Brain</title>
  <meta name="description" content="A see-through 3D brain with 21 areas explained by what you use them for.">
  <meta name="theme-color" content="#15101d">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body class="page-explore">
  <a class="skip-link" href="#parts">Skip to the list of brain areas</a>
  <header class="nav">
    <a class="brand" href="/">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M15 5.5C9 5.5 4.5 10 4.5 16s4.5 10.5 10.5 10.5" stroke="#F3ECE4" stroke-width="1.7" fill="none" stroke-linecap="round"/><path d="M17 5.5c6 0 10.5 4.5 10.5 10.5S23 26.5 17 26.5" stroke="#F3ECE4" stroke-width="1.7" fill="none" stroke-linecap="round" opacity=".5"/><path d="M8.5 13.2c2-1.6 4.2-1.6 6.5 0M8.5 19c2.2 1.5 4.3 1.5 6.5 0" stroke="#F3ECE4" stroke-width="1.5" fill="none" stroke-linecap="round" opacity=".7"/><circle cx="21.6" cy="12.6" r="2.5" fill="#F2C66D"/></svg>
      <span class="brand-text">Inside Your Brain</span>
    </a>
    <nav aria-label="Main">
      <ul class="nav-links">
        <li><a href="/replay.html">Replay</a></li>
        <li><a href="/explore.html">Explore</a></li>
        <li><a href="/lab.html">Lab</a></li>
      </ul>
    </nav>
    <button class="btn btn-quiet btn-small nav-ask" type="button" data-ask-open data-ai-only>Ask</button>
  </header>

  <main id="main" class="explore">
    <aside class="explore-list" id="parts" aria-label="Brain areas" tabindex="-1">
      <div class="seg" role="radiogroup" aria-label="What to show">
        <button type="button" role="radio" aria-checked="true" data-mode="parts">Parts</button>
        <button type="button" role="radio" aria-checked="false" data-mode="lobes">Lobes</button>
      </div>
      <div id="list"></div>
    </aside>
    <div class="explore-stage">
      <div class="brain-stage explore-brain" id="stage">
        <p class="brain-loading">Loading the brain</p>
        <p class="brain-fallback">Your browser couldn’t show the 3D brain. Use the list to read about each part.</p>
      </div>
      <p class="stage-hint" id="hint">Drag to turn the brain. Click a glowing dot, or pick a part from the list.</p>
      <div class="stage-tools">
        <button class="btn btn-quiet btn-small" type="button" id="reset">Reset view</button>
      </div>
    </div>
    <section class="explore-detail" id="detail" aria-live="polite" tabindex="-1"></section>
  </main>

  <script type="module" src="/src/pages/explore.js"></script>
</body>
</html>
